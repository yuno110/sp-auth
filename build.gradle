plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'auth-service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// JWT — auth 는 서명과 검증을 모두 한다 (sp-docs/tech-stack.md §3.2)
	// 개인키를 갖는 유일한 서비스다. member·board 에는 oauth2-jose 를 넣지 않는다
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// Lombok (annotationProcessor 선언은 QueryDSL보다 먼저)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// API Docs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	// DB / Migration
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// @ActiveProfiles 를 빠뜨린 테스트가 main 설정으로 도는 것을 막는다
	// (sp-docs/tech-stack.md §5.1)
	systemProperty 'spring.profiles.active', 'test'
}

// ADMIN seed 의 BCrypt 해시를 만든다 (sp-docs/tech-stack.md §4.2.1).
// 해시는 커밋하지 않는다 — V3 는 Flyway placeholder 를 쓰고, 로컬 값은
// application-local.yml 에 넣는다 (sp-docs/requirements/member.md §10.2).
//
// 표준출력에 해시 한 줄만 낸다. 평문은 출력하지 않는다.
//
// Gradle 9 에서 doLast 안의 project.javaexec 가 제거됐고, 별도 main 클래스를 운영 코드에
// 넣고 싶지도 않다. 그래서 런타임 클래스패스를 격리된 로더로 올려 인코더만 꺼내 쓴다.
tasks.register('bcrypt') {
	group = 'help'
	description = 'ADMIN seed 용 BCrypt 해시를 출력한다. ./gradlew bcrypt -Ppassword=...'
	dependsOn configurations.runtimeClasspath
	doLast {
		if (!project.hasProperty('password')) {
			throw new GradleException('비밀번호를 준다: ./gradlew bcrypt -Ppassword=...')
		}
		URL[] urls = configurations.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
		new URLClassLoader(urls, (ClassLoader) null).withCloseable { loader ->
			// strength 10 (sp-docs/security.md §1). SecurityConfig 의 PasswordEncoder 와 같다
			def encoderType = loader.loadClass('org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder')
			def encoder = encoderType.getConstructor(int.class).newInstance(10)
			println encoderType.getMethod('encode', CharSequence).invoke(encoder, project.property('password').toString())
		}
	}
}

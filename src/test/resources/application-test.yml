# 테스트는 H2(MySQL 호환 모드)를 쓴다 (sp-docs/tech-stack.md §1)
#
# 이 URL 은 sp-docs/tech-stack.md §5.3 의 정본이다. 파라미터를 빼지 않는다.
#   MODE=MySQL                   마이그레이션의 MySQL 문법(AUTO_INCREMENT, ENGINE=InnoDB)
#   DATABASE_TO_LOWER            테이블명을 MySQL 과 같이 소문자로 저장한다
#   CASE_INSENSITIVE_IDENTIFIERS (위와 한 쌍)
#   DB_CLOSE_DELAY=-1            마지막 커넥션이 닫혀도 DB 를 유지한다. 없으면 Flyway 가
#                                다시 돌지 않아 이후 테스트가 "테이블 없음"으로 간헐 실패한다
spring:
  datasource:
    url: jdbc:h2:mem:sp_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 스키마 출처를 Flyway 하나로 고정한다 (sp-docs/tech-stack.md §5.1)
      ddl-auto: validate
  flyway:
    placeholders:
      # 테스트는 가드를 통과해야 기동되므로 값이 반드시 있어야 한다. BCrypt 모양을 쓰지
      # 않는다 — 실제 자격증명이 아니어도 시크릿 스캐너에 걸리고, "해시를 커밋하지 않는다"고
      # 정한 것과 모양이 같아 읽는 사람이 구분할 수 없다 (sp-docs/requirements/member.md §10.2).
      # 가드는 hasText 와 "${" 시작 여부만 보고 형식을 보지 않는다.
      # 운영·로컬 값은 ADMIN_PASSWORD_HASH / application-local.yml 이 준다
      adminPasswordHash: test-not-a-hash

# 테스트 전용 값이다. 정책값이 아니다 — 정본(sp-docs/security.md §1)은 "* 금지"만 정하고
# 허용 오리진 목록을 정하지 않았다. 운영·로컬 값은 환경이 준다 (application.yml 주석 참조)
cors:
  allowed-origins: http://localhost:3000

# jwt.private-key-location 은 여기에 두지 않는다. 개인키를 저장소에 넣지 않기 위해
# 테스트가 실행 시점에 임시 키 페어를 만들어 경로를 주입한다
# (com.example.auth.support.TestRsaKeys)

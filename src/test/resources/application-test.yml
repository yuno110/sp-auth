# 테스트는 H2(MySQL 호환 모드)를 쓴다 (sp-docs/tech-stack.md §1)
#
# 이 URL 은 sp-docs/tech-stack.md §5.3 의 정본이다. 파라미터를 빼지 않는다.
#   MODE=MySQL                   마이그레이션의 MySQL 문법(AUTO_INCREMENT, ENGINE=InnoDB)
#   DATABASE_TO_LOWER            테이블명을 MySQL 과 같이 소문자로 저장한다
#   CASE_INSENSITIVE_IDENTIFIERS (위와 한 쌍)
#   DB_CLOSE_DELAY=-1            마지막 커넥션이 닫혀도 DB 를 유지한다. 없으면 Flyway 가
#                                다시 돌지 않아 이후 테스트가 "테이블 없음"으로 간헐 실패한다
spring:
  datasource:
    url: jdbc:h2:mem:sp_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 스키마 출처를 Flyway 하나로 고정한다 (sp-docs/tech-stack.md §5.1)
      ddl-auto: validate
  flyway:
    placeholders:
      # 테스트는 가드를 통과해야 기동되므로 값이 반드시 있어야 한다. BCrypt 모양을 쓰지
      # 않는다 — 실제 자격증명이 아니어도 시크릿 스캐너에 걸리고, "해시를 커밋하지 않는다"고
      # 정한 것과 모양이 같아 읽는 사람이 구분할 수 없다 (sp-docs/requirements/member.md §10.2).
      # 가드는 hasText 와 "${" 시작 여부만 보고 형식을 보지 않는다.
      # 운영·로컬 값은 ADMIN_PASSWORD_HASH / application-local.yml 이 준다
      adminPasswordHash: test-not-a-hash
  # 메일 (sp-docs/tech-stack.md §4.7). 기동 가드가 기본값 없는 키를 막으므로 값이 있어야 뜬다.
  # 테스트는 SMTP 에 접속하지 않는다 — 운영 프로파일을 함께 켜지 않은 @SpringBootTest 컨텍스트에서는
  # 시험용 발송기(com.example.auth.support.TestMailConfig)가 발송을 받는다. host 는 예약된 .invalid 이름이라
  # (RFC 2606) 실수로 접속을 시도해도 닿을 서버가 없다. username·password 는 로컬 Mailpit 과 같은
  # 빈 값이다 — 운영 프로파일의 테스트는 둘을 따로 준다 (ProdProfileTest)
  mail:
    host: smtp.test.invalid
    port: 1025
    username:
    password:

# 메일의 보내는 주소와 링크의 기준 주소. 테스트 전용 값이다
mail:
  from: no-reply@test.invalid
  frontend-base-url: http://localhost:3000

# 테스트 전용 값이다. 정책값이 아니다 — 정본(sp-docs/security.md §1)은 "* 금지"만 정하고
# 허용 오리진 목록을 정하지 않았다. 운영·로컬 값은 환경이 준다 (application.yml 주석 참조)
cors:
  allowed-origins: http://localhost:3000

# 요청 수 제한의 한도를 크게 덮는다 (sp-docs/security.md §10). @SpringBootTest 는 캐시된 컨텍스트의 제한기 하나를
# 여러 테스트가 나눠 쓰고 MockMvc 의 요청 주소가 하나라, 운영 한도로는 제한과 무관한 테스트가 429 를 맞는다.
# 창·버킷 수는 application.yml 의 값을 그대로 쓴다. 정본 값은 RateLimitConfigTest 가 application.yml 에서 읽어 보고,
# 제한의 동작은 한도를 작게 다시 덮은 테스트가 본다 (RateLimitControllerTest)
rate-limit:
  rules:
    check-email:          { limit: 100000 }
    signup:               { limit: 100000 }
    password-reset-ip:    { limit: 100000 }
    password-reset-email: { limit: 100000 }
    verification-ip:      { limit: 100000 }
    verification-email:   { limit: 100000 }
    login:                { limit: 100000 }

# 정리 작업(AccountCleanup)이 테스트 도중에 스스로 돌지 않게 주기를 하루로 늘린다. 첫 실행도 기동 뒤 이 주기만큼 늦으므로
# 테스트 실행 동안 스케줄러가 부르지 않는다 — 스스로 돌면 다른 스레드에서 테스트가 바꿔 끼운 시계를 읽어 그 테스트의 행을
# 지울 수 있다. 정리는 테스트가 직접 부르고, 주기의 등록은 AccountCleanupTest 가 다른 값으로 덮어 본다.
# 운영 값(PT1H)은 application.yml 에 있다
account-cleanup:
  interval: P1D

# jwt.private-key-location 은 여기에 두지 않는다. 개인키를 저장소에 넣지 않기 위해
# 테스트가 실행 시점에 임시 키 페어를 만들어 경로를 주입한다
# (com.example.auth.support.TestRsaKeys)

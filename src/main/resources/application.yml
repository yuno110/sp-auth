spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sp_auth?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    # 비밀 값은 기본값을 두지 않는다. 없으면 기동이 실패한다 (sp-docs/tech-stack.md §4.3)
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  flyway:
    placeholders:
      # ADMIN seed 의 BCrypt 해시. 비밀 값이므로 기본값을 두지 않는다 — 없으면
      # 마이그레이션이 "No value provided for placeholder" 로 실패한다
      # (sp-docs/requirements/member.md §10.2, sp-docs/tech-stack.md §4.3).
      # 해시 생성: ./gradlew bcrypt -Ppassword=...
      adminPasswordHash: ${ADMIN_PASSWORD_HASH}
  # SMTP (sp-docs/tech-stack.md §4.7). 넷 다 기본값을 두지 않는다 — host·port 는 정책값,
  # username·password 는 비밀값이다 (§4.3). 기본값이 없는 것이 기동 실패를 보장하지 않으므로(§4.3 —
  # 실패하느냐는 값을 받는 쪽에 달렸다) 기동을 막는 것은 가드다 (com.example.auth.mail.MailStartupGuard).
  # 로컬은 application-local.yml 이 Mailpit 의 값을 준다 (§4.7.1)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    # 연결 5초, 읽기 10초, 쓰기 10초 (sp-docs/tech-stack.md §4.7, sp-docs/nfr.md §3).
    # JavaMail 의 기본은 무한 대기라, 없으면 SMTP 가 응답하지 않을 때 발송 스레드가 영영 묶인다
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8083

# health 만 노출한다. 그 밖의 actuator 경로는 노출 자체를 막는다
# (sp-docs/security.md §5.1.1). 인가 쪽 차단은 SecurityConfig 가 한다
management:
  endpoints:
    web:
      exposure:
        include: health
  # health 를 SMTP 에 묶지 않는다. spring.mail.host 가 있으면 Boot 의 메일 헬스 지표가 켜져 health 가
  # SMTP 접속을 따른다 — 2026-11-13 AU-14 측정: 이 값을 환경변수로 true 로 덮자 SMTP 가 없는 테스트
  # 프로파일의 /actuator/health 가 503 이었다(MailHealthIndicator 의 접속 실패). SMTP 가 죽어도 이미
  # 인증된 계정의 로그인과 다른 기능은 영향이 없으므로(sp-docs/nfr.md §2 의 SMTP 줄) 이 서비스의 health 를
  # 그것으로 내리지 않는다. 끄는 결정은 sp-docs/plan/phase2-auth-member.md AU-14 가 했다
  health:
    mail:
      enabled: false

# 토큰 서명용 개인키. 이 서비스만 갖는다 (sp-docs/security.md §2).
# 비밀 값이므로 기본값을 두지 않는다. 로컬에서는 application-local.yml 이 덮는다
# (sp-docs/tech-stack.md §4.3.1).
#
# 만료 시간은 sp-docs/security.md §1 이 고정한다 — Access 30분(1800초),
# Refresh 14일(1209600초). 환경값이 아니므로 placeholder 를 두지 않는다
jwt:
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
  access-token-validity: PT30M
  refresh-token-validity: P14D

# CORS 허용 오리진 화이트리스트.
#
# 정본(sp-docs/security.md §1)은 "서비스별 화이트리스트로 관리, * 금지"만 정하고 목록 자체를
# 정하지 않았다. 그래서 값을 코드·커밋되는 설정에 박지 않고 환경에서 주입받는다.
# 기본값을 두지 않으므로 값이 없으면 기동이 실패한다 — 임의의 기본값을 두면 그 값이 정책인지
# 임시값인지 나중에 구분할 수 없다. 로컬 값은 application-local.yml 이 준다
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 메일 (sp-docs/tech-stack.md §4.7, sp-docs/requirements/member.md §11.5).
#   from               보내는 주소. 정책값이라 기본값이 없다
#   frontend-base-url  메일 링크의 기준 주소(화면의 오리진). 정책값이라 기본값이 없고 http·https 의
#                      절대 URL 이어야 한다. 요청의 Host 로 대신하지 않는다 (sp-docs/security.md §12)
#   executor.queue-capacity  발송 대기열의 상한. 편의값이다. 차면 그 작업을 버리고 WARN
mail:
  from: ${MAIL_FROM}
  frontend-base-url: ${FRONTEND_BASE_URL}
  executor:
    queue-capacity: 100
